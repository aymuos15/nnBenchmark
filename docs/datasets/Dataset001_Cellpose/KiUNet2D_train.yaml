#===============================================================================
# KiU-Net 2D Training Configuration - Dataset001_Cellpose
#===============================================================================
# Ready-to-train config for KiU-Net dual-branch architecture
# Inherits base configuration from fold_0.yaml and overrides model settings
#===============================================================================

base_config: fold_0.yaml

overrides:
  # ============================================================================
  # Model Architecture - KiU-Net 2D
  # ============================================================================

  model:
    type: KiUNet2D

    # Shared parameters
    spatial_dims: 2
    in_channels: 1
    out_channels: 2

    # Deep supervision
    deep_supervision: true
    deep_supr_num: 1
    ds_weights: [1.0, 0.5]

    # KiU-Net specific
    KiUNet2D:
      # Smaller architecture for faster training
      features: [32, 64, 128]  # 3 levels (vs DynUNet's 7)
      norm_name: instance
      act_name: leakyrelu

  # ============================================================================
  # Training Configuration Overrides
  # ============================================================================

  training:
    epochs: 1000
    batch_size: 2
    num_workers: 4
    val_interval: 5
