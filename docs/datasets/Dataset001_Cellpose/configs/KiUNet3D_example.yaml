#===============================================================================
# KiU-Net 3D - Dual-Branch 3D Architecture Configuration (Example)
#===============================================================================
#
# KiU-Net 3D extends the dual-branch architecture to volumetric data:
# - U-Net Branch: Under-complete 3D path with max pooling
# - Ki-Net Branch: Over-complete 3D path with trilinear upsampling
# - 3D Convolutions: All operations use Conv3d, MaxPool3d, etc.
#
# Reference:
#   Valanarasu et al. "KiU-Net: Overcomplete Convolutional Architectures for
#   Biomedical Image and Volumetric Segmentation." IEEE TMI, 2021.
#
# Key KiU-Net 3D Parameters:
#   - Features: Channel counts at each 3D encoder level [16, 32, 64]
#   - Spatial Operations: All 3D (Conv3d, MaxPool3d, trilinear interpolation)
#   - Memory Considerations: 3D models require more memory than 2D
#
# Note: This is an example configuration for 3D data. Adapt dataset parameters
#       (spatial_size, median_shape, etc.) based on your actual 3D dataset.
#
#===============================================================================

_comment: KiU-Net 3D example configuration (adapt for your 3D dataset)

# ============================================================================
# Dataset Configuration (Example for 3D Medical Imaging)
# ============================================================================

dataset:
  name: YourDataset3D  # Replace with your dataset name
  median_shape: [1, 64, 64, 64]  # Example: single channel, 64x64x64 volume
  median_spacing: [1.0, 1.0, 1.0]  # Isotropic spacing
  foreground_intensity_mean: 100.0  # Adjust based on your data
  spatial_size: [64, 64, 64]  # 3D patch size (adjust based on GPU memory)
  num_classes: 2  # Binary segmentation (adjust for multi-class)
  fold: 0
  cache:
    enabled: true
    cache_rate: 1.0

# ============================================================================
# Model Architecture - KiU-Net 3D
# ============================================================================

model:
  type: KiUNet3D  # Dual-branch 3D architecture

  # Shared Parameters
  spatial_dims: 3  # 3D architecture
  in_channels: 1
  out_channels: 2

  # Deep Supervision (recommended)
  deep_supervision: true
  deep_supr_num: 1
  ds_weights: [1.0, 0.5]

  # KiU-Net3D Specific Parameters
  KiUNet3D:
    # Feature channels at each 3D encoder level
    # Use fewer channels for 3D due to memory constraints
    # 3D convolutions use ~8x more memory than 2D at same resolution
    features: [16, 32, 64]  # Fewer levels and channels than 2D

    # Normalization strategy
    # InstanceNorm3d recommended for 3D medical imaging
    norm_name: instance

    # Activation function
    # Default: leakyrelu (nnU-Net style)
    act_name: leakyrelu

# ============================================================================
# Loss Function Configuration
# ============================================================================

loss:
  type: DiceCELoss
  DiceCELoss:
    include_background: false
    to_onehot_y: false
    softmax: true
    lambda_dice: 1.0
    lambda_ce: 1.0

# ============================================================================
# Training Configuration
# ============================================================================

training:
  epochs: 500
  batch_size: 1  # 3D typically requires batch_size=1 due to memory
  num_workers: 4

  # Learning rate and scheduling
  learning_rate: 0.01
  lr_scheduler:
    type: PolyLR
    power: 0.9

  # Optimizer
  optimizer:
    type: SGD
    momentum: 0.99
    weight_decay: 0.00003
    nesterov: true

  # Validation and checkpointing
  val_interval: 5
  checkpoint_metric: DiceMetric

  # Metrics to plot
  plot_metrics:
  - DiceMetric
  - HausdorffDistanceMetric

  # Training augmentations (3D-specific)
  augmentations:
    enabled: true

    # 3D spatial transformations
    RandFlipd:
      keys: [image, label]
      prob: 0.5
      spatial_axis: [0, 1, 2]  # All 3 axes

    RandRotate90d:
      keys: [image, label]
      prob: 0.5
      spatial_dims: [0, 1, 2]  # 3D rotations

    RandScaleIntensityd:
      keys: [image]
      factors: 0.3
      prob: 0.5

    RandShiftIntensityd:
      keys: [image]
      offsets: 0.1
      prob: 0.5

    RandGaussianNoised:
      keys: [image]
      prob: 0.15
      mean: 0.0
      std: 0.1

    RandGaussianSmoothd:
      keys: [image]
      prob: 0.15
      sigma_x: [0.5, 1.0]
      sigma_y: [0.5, 1.0]
      sigma_z: [0.5, 1.0]  # Z-axis smoothing

# ============================================================================
# Inference Configuration
# ============================================================================

inference:
  batch_size: 1  # Typically 1 for 3D
  num_workers: 2

  # Sliding window inference (essential for large 3D volumes)
  sliding_window:
    enabled: true
    overlap: 0.5
    sw_batch_size: 2  # Smaller for 3D
    mode: gaussian
    padding_mode: constant

  # Post-processing
  postprocessing:
    remove_small_objects: false
    min_object_size: 100  # Larger threshold for 3D

# ============================================================================
# Metrics Configuration
# ============================================================================

validation_metrics:
- &id001
  type: DiceMetric
  name: dice_score
  DiceMetric:
    include_background: false
    reduction: mean_batch
    get_not_nans: true

- &id002
  type: HausdorffDistanceMetric
  name: hausdorff_95
  HausdorffDistanceMetric:
    include_background: false
    percentile: 95
    reduction: mean_batch
    get_not_nans: true
inference_metrics:
- *id001
- *id002
