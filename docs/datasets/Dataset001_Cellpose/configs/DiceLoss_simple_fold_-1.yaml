#===============================================================================
# DiceLoss Configuration for Dataset001_Cellpose (fold=-1) - UNet (Simple)
#===============================================================================
# Inherits: fold_0.yaml → base_exp.yaml → this config
# Model: UNet (simple), 1000 epochs, CCMetric included
#===============================================================================

base_config: base_exp.yaml

overrides:
  model:
    type: UNet

  loss:
    type: DiceLoss
    to_onehot_y: true
    softmax: true
    include_background: false
