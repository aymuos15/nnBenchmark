#===============================================================================
# BlobLoss Configuration for Dataset001_Cellpose (fold=-1) - UNet (Simple)
#===============================================================================
# Inherits: fold_0.yaml → base_exp.yaml → this config
# Model: UNet (simple), 1000 epochs, CCMetric included
#===============================================================================

base_config: base_exp.yaml

overrides:
  model:
    type: UNet

  loss:
    type: BlobLoss
    base_loss: DiceLoss
    main_weight: 3.0
    blob_weight: 1.0
    sigmoid: false
    to_onehot_y: true
