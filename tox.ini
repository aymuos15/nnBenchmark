[tox]
requires =
    tox>=4.0
    tox-uv>=1.0
env_list =
    py310
    py311
    py312
    py313
    lint
    type
    pyright
    coverage

# Use uv for faster dependency installation
[testenv]
package = wheel
wheel_build_env = .pkg
runner = uv-venv-runner
commands =
    pytest {posargs}
extras =
    dev

[testenv:py310]
description = Run tests with Python 3.10
basepython = python3.10

[testenv:py311]
description = Run tests with Python 3.11
basepython = python3.11

[testenv:py312]
description = Run tests with Python 3.12
basepython = python3.12

[testenv:py313]
description = Run tests with Python 3.13
basepython = python3.13

[testenv:lint]
description = Run code linting with ruff
skip_install = false
commands =
    ruff check .

[testenv:lint-fix]
description = Run code linting with ruff and auto-fix issues
skip_install = false
commands =
    ruff check . --fix

[testenv:type]
description = Run type checking with ty
skip_install = false
commands =
    python -m ty check

[testenv:pyright]
description = Run type checking with pyright
skip_install = false
commands =
    pyright

[testenv:vulture]
description = Check for dead code using vulture
skip_install = false
commands =
    vulture src/ tests/

[testenv:coverage]
description = Run tests with coverage report
commands =
    pytest --cov=src --cov-report=term-missing --cov-report=html

[testenv:coverage-xml]
description = Run tests with XML coverage report (for CI)
commands =
    pytest --cov=src --cov-report=xml --cov-report=term

[testenv:fast]
description = Run tests with minimal output (fast feedback)
commands =
    pytest -q --tb=short --no-cov

[testenv:verbose]
description = Run tests with verbose output
commands =
    pytest -v

[testenv:integration]
description = Run integration test (full pipeline)
allowlist_externals = bash
commands =
    bash integration_test.sh

[testenv:all]
description = Run linting, type checking, dead code analysis, and tests
skip_install = false
commands =
    ruff check .
    python -m ty check
    pyright
    vulture src/ tests/
    pytest --cov=src --cov-report=term-missing
