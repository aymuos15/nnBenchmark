# Pre-commit hooks for nnBenchmark
# See https://pre-commit.com for more information

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # Allow custom YAML tags
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]

  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]

      # Run the formatter
      - id: ruff-format
        types_or: [python, pyi]

  # Type checking with basedpyright (improved fork of pyright)
  - repo: https://github.com/DetachHead/basedpyright-pre-commit-mirror
    rev: v1.13.0
    hooks:
      - id: basedpyright
        additional_dependencies:
          - torch>=2.0.0
          - monai>=1.3.0
          - numpy>=1.24.0
          - pillow>=10.0.0
          - pyyaml>=6.0
          - pytorch-ignite>=0.4.0
          - tqdm>=4.65.0
          - loguru>=0.7.0
          - scikit-learn>=1.3.0
          - nibabel>=5.0.0
          - matplotlib>=3.7.0
          - pytest>=7.4.0
          - psutil>=5.4.0

# Local hooks for project-specific checks
  - repo: local
    hooks:
      # Type checking with ty (experimental type checker from Astral)
      - id: ty
        name: ty type check
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

      # Check for print statements in source code (not tests, CLI tools, utilities, or logging)
      - id: no-print-statements
        name: Check for print statements
        entry: 'print\('
        language: pygrep
        files: ^src/.*\.py$
        exclude: ^src/(engines|plotting|planning|utils|logging)/.*\.py$

      # NOTE: check-future-annotations would require inverted logic (fail if NOT present)
      # pygrep doesn't support that easily, so this is disabled
      # All files already have the import, so it's safe to skip

# Configuration
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  submodules: false
