[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nnbenchmark"
version = "0.1.3"
description = "Neural Network Benchmarking Framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Soumya Snigdha Kundu"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "monai>=1.3.0",
    "pytorch-ignite>=0.4.0",
    "tqdm>=4.65.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "nibabel>=5.0.0",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "pillow>=10.0.0",
    "psutil>=5.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ty>=0.0.1a1",
    "ruff>=0.0.285",
    "pyright>=1.1.0",
    "ipython>=8.14.0",
    "tox>=4.0.0",
    "tox-uv>=1.0.0",
    "pre-commit>=3.0.0",
    "vulture>=2.7.0",
]

[project.scripts]
"nnBench.train" = "src.engines.train.cli:main"
"nnBench.inference" = "src.engines.inference.cli:main"
"nnBench.plot" = "src.plotting.cli:main"
"nnBench.plan" = "src.planning.cli:main"

[tool.setuptools]
packages = ["src", "src.config", "src.factory", "src.factory.losses", "src.factory.metrics", "src.factory.models", "src.factory.optimizers", "src.factory.transforms", "src.logging", "src.utils", "src.planning", "src.planning.fingerprinting", "src.planning.planner", "src.plotting", "src.engines", "src.engines.train", "src.engines.inference", "src.engines.ignite_utils", "src.preprocessing"]

[tool.setuptools.package-data]
src = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501", "N812"]  # Disable line length checks; Allow F for torch.nn.functional

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.coverage.run]
parallel = true
omit = ["*/site-packages/*"]

[tool.coverage.report]
skip_empty = true
precision = 2

[tool.vulture]
min_confidence = 60
exclude = [".venv", ".tox", "build", "dist"]
paths = ["src", "tests"]
ignore_names = [
    "attach",                # MONAI Handler method
    "forward",               # PyTorch module method / MONAI decorator functions
    "compute_metrics",       # Ignite engine decorator functions
    "run_validation",        # Ignite engine decorator functions
    "step",                  # Custom LR scheduler method
    "get_last_lr",           # Custom LR scheduler method
    "return_value",          # Mock attribute
    "side_effect",           # Mock attribute
    "_setup_nnunet_env_vars",  # pytest autouse fixture
    "unregister",            # Part of public registry API for all registries
    "requires_grad",         # PyTorch tensor attribute set in tests for gradient tracking
]

[tool.pyright]
include = ["src", "tests"]
exclude = [".venv", ".tox", "build", "dist"]
typeCheckingMode = "standard"
reportUnusedVariable = true
reportUnnecessaryIsInstance = true
reportIncompatibleMethodOverride = true
reportPrivateImportUsage = false  # Allow using public re-exports from MONAI/torch
